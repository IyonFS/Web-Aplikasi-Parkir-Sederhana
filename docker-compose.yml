version: '3.9'

services:
  # ── PostgreSQL Database ──────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: hygiopark-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: hygiopark
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d hygiopark"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── pgAdmin (Database GUI - optional) ───────────────────────────────────
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: hygiopark-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@hygiopark.io
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"
    depends_on:
      - postgres
    profiles:
      - tools  # jalankan dengan: docker compose --profile tools up

volumes:
  postgres_data:
    driver: local

# ── Cara Pakai ──────────────────────────────────────────────────────────────
# 1. Jalankan PostgreSQL saja:
#    docker compose up -d postgres
#
# 2. Jalankan PostgreSQL + pgAdmin:
#    docker compose --profile tools up -d
#
# 3. Stop semua:
#    docker compose down
#
# 4. Hapus data (reset database):
#    docker compose down -v


